#
# Tâche 2 — vérifie le module étudié (tests générés + manuels) en CI.
# Complète le workflow upstream « main jdk17 build » (suite Maven complète).
#

name: tache2 tika-serialization tests

on:
  push:
    branches: [ main ]
    paths:
      - 'tika-serialization/**'
      - '.github/workflows/tache2-tika-serialization.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'tika-serialization/**'
      - '.github/workflows/tache2-tika-serialization.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
      - name: Run tika-serialization tests
        run: ./mvnw -pl tika-serialization test -B "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
